name: Test and Release

on:
  push:
    branches: ["main"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: "22.x"
          lint: true
          install-command: "npm install"
          package-cache: "false"

  # Our own unit tests (mocha), independent of the checker action above
  unit-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: [check-and-lint]
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          install-command: "npm install"
          package-cache: "false"

  # Secrets can't be referenced directly in a job-level "if:" condition,
  # so we resolve whether NPM_TOKEN is configured here (as a step output,
  # which *is* allowed) and pass that along via `needs.*.outputs`. Without
  # this indirection, npm publishing stays a manual step and the "deploy"
  # job below is skipped cleanly instead of failing on every tag push.
  check-secrets:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    outputs:
      has-npm-token: ${{ steps.check.outputs.has-npm-token }}
    steps:
      - id: check
        run: echo "has-npm-token=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [check-and-lint, unit-tests, adapter-tests, check-secrets]
    if: |
      contains(github.ref, 'refs/tags/') &&
      needs.check-secrets.outputs.has-npm-token == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: "24.x"
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
