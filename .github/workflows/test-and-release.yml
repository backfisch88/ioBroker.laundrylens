name: Test and Release

on:
  push:
    branches: ["main"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: "22.x"
          lint: true
          install-command: "npm install"
          package-cache: "false"

  # Our own unit tests (mocha), independent of the checker action above
  unit-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: [check-and-lint]
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          install-command: "npm install"
          package-cache: "false"

  deploy:
    needs: [check-and-lint, unit-tests, adapter-tests]
    # Uses npm Trusted Publishing (OIDC) instead of a long-lived NPM_TOKEN -
    # no npm-token is passed to the deploy action on purpose (E3019: setting
    # npm-token disables trusted publishing). Gated behind a repo variable
    # (Settings -> Secrets and variables -> Actions -> Variables ->
    # NPM_TRUSTED_PUBLISHING = true) so tag pushes stay a deliberate,
    # opt-in publish rather than happening the moment a tag exists.
    if: |
      contains(github.ref, 'refs/tags/') &&
      vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: "24.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}
